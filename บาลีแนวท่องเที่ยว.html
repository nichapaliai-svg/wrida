<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALI DHAMMA TRAVEL — 15 เกม</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Tahoma", "Noto Sans Thai", sans-serif;
    background: #111;
  }

  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
    background: #f5f1e8;
  }

  /* =========================
     ซ้าย = ภาพประจำวัด
     ========================= */
  .temple-panel {
    width: 35%;
    min-width: 280px;
    height: 100%;
    background: #151515;
    display: flex;
    flex-direction: column;
    border-right: 4px solid #c9a227;
    position: relative;
  }

  .temple-image-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow: hidden;
  }

  .temple-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255, 215, 80, .25);
  }

  .temple-title {
    text-align: center;
    color: #fff;
    background: linear-gradient(90deg, #6b4d09, #c9a227, #6b4d09);
    padding: 12px 8px;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: bold;
  }

  .memory-text {
    text-align: center;
    color: #f5df9a;
    background: #211a0d;
    padding: 7px;
    font-size: clamp(11px, 1.2vw, 15px);
  }

  /* =========================
     ขวา = เกม
     ========================= */
  .game-panel {
    width: 65%;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .game-header {
    background: #fff;
    padding: 12px 18px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .game-number {
    font-size: clamp(20px, 2.5vw, 34px);
    font-weight: bold;
    color: #6b4d09;
  }

  .progress {
    color: #666;
    font-size: 14px;
  }

  .game-content {
    flex: 1;
    overflow: auto;
    padding: clamp(15px, 3vw, 40px);
  }

  .card {
    max-width: 850px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    padding: clamp(18px, 3vw, 36px);
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
  }

  .question {
    font-size: clamp(20px, 2.3vw, 32px);
    line-height: 1.5;
    font-weight: bold;
    color: #222;
    margin-bottom: 25px;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .choice {
    border: 2px solid #d8c99c;
    background: #fffdf5;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    font-size: clamp(16px, 1.7vw, 22px);
    transition: .15s;
  }

  .choice:hover {
    transform: translateY(-2px);
    background: #fff4c9;
  }

  .choice.correct {
    background: #dff3df;
    border-color: #5b9b5b;
  }

  .choice.wrong {
    background: #f8dddd;
    border-color: #b55;
  }

  .result {
    margin-top: 18px;
    min-height: 32px;
    font-weight: bold;
    font-size: 18px;
  }

  .bottom-nav {
    display: flex;
    gap: 10px;
    padding: 12px 18px;
    background: #fff;
    border-top: 1px solid #ddd;
  }

  button {
    border: 0;
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
  }

  .nav-btn {
    background: #6b4d09;
    color: white;
  }

  .nav-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .game-selector {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    flex: 1;
    padding-bottom: 2px;
  }

  .game-dot {
    min-width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    background: #eee;
    color: #555;
  }

  .game-dot.active {
    background: #c9a227;
    color: #fff;
  }

  @media (max-width: 700px) {
    .temple-panel { width: 42%; min-width: 0; }
    .game-panel { width: 58%; }
    .choices { grid-template-columns: 1fr; }
    .temple-image-wrap { padding: 8px; }
    .temple-title { font-size: 14px; }
    .memory-text { font-size: 10px; }
    .game-header { padding: 8px; }
    .bottom-nav { padding: 8px; }
  }
</style>
</head>

    <div class="temple-title">
      วัด / ภาพประจำหัวข้อ
    </div>

    <div class="memory-text">
      ภาพนี้จะแสดงตลอดการเล่นเกมทั้ง 15 เกม
    </div>
  </aside>

  <!-- =========================
       ด้านขวา: เกม 1–15
       ========================= -->
  <main class="game-panel">

    <header class="game-header">
      <div class="game-number" id="gameTitle">เกมที่ 1</div>
      <div class="progress" id="progressText">เกม 1 / 15</div>
    </header>

    <section class="game-content">
      <div class="card">
        <div class="question" id="question">
          ภาพพระพุทธรูปนี้เกี่ยวข้องกับสิ่งใดมากที่สุด?
        </div>

        <div class="choices" id="choices"></div>

        <div class="result" id="result"></div>
      </div>
    </section>

    <footer class="bottom-nav">
      <button class="nav-btn" id="prevBtn" onclick="previousGame()">‹ ก่อนหน้า</button>

      <div class="game-selector" id="gameSelector"></div>

      <button class="nav-btn" id="nextBtn" onclick="nextGame()">ถัดไป ›</button>
    </footer>

  </main>
</div>

<script>
/*
  โครงสร้างสำหรับ 15 เกม
  ภาพด้านซ้ายจะไม่ถูกเปลี่ยนเมื่อเปลี่ยนเกม
  เปลี่ยนเฉพาะข้อมูลด้านขวา
*/

const games = Array.from({length: 15}, (_, i) => ({
  title: `เกมที่ ${i + 1}`,
  question: [
    "ภาพพระพุทธรูปนี้เกี่ยวข้องกับสิ่งใดมากที่สุด?",
    "ข้อใดเป็นสิ่งที่ควรศึกษาเมื่อเข้าชมวัด?",
    "การเห็นพระพุทธรูปควรทำให้เรานึกถึงสิ่งใด?",
    "ข้อใดสอดคล้องกับการเรียนรู้ธรรมะ?",
    "เมื่อเกิดทุกข์ เราควรเริ่มต้นพิจารณาอะไร?",
    "ข้อใดเป็นการฝึกสติในชีวิตประจำวัน?",
    "ธรรมะมีประโยชน์ต่อชีวิตอย่างไร?",
    "ข้อใดช่วยให้จิตใจสงบ?",
    "การรู้เท่าทันอารมณ์มีประโยชน์อย่างไร?",
    "ข้อใดเป็นการใช้ปัญญา?",
    "เมื่อพบปัญหา ควรทำอย่างไร?",
    "ข้อใดช่วยลดความยึดติด?",
    "การเรียนธรรมะควรนำไปใช้อย่างไร?",
    "ข้อใดเป็นแนวทางดับทุกข์?",
    "เมื่อจบเกมนี้ เราควรนำสิ่งใดไปใช้ในชีวิต?"
  ][i],
  choices: [
    ["การเรียนรู้ธรรมะ", "การแข่งขัน", "การซื้อสินค้า", "การท่องเที่ยวอย่างเดียว"],
    ["ประวัติและธรรมะ", "ราคาสินค้า", "การแข่งขัน", "เรื่องที่ไม่เกี่ยวข้อง"],
    ["สติและปัญญา", "ความโกรธ", "ความประมาท", "ความหลง"],
    ["นำไปปฏิบัติ", "จำอย่างเดียว", "หลีกเลี่ยงทุกปัญหา", "ไม่ต้องสนใจ"],
    ["เหตุแห่งทุกข์", "คนอื่นผิดเสมอ", "โชคชะตาอย่างเดียว", "สิ่งภายนอกเท่านั้น"],
    ["รู้ตัวขณะทำสิ่งต่าง ๆ", "ทำทุกอย่างเร็วที่สุด", "ไม่คิดอะไร", "หลีกหนีปัญหา"],
    ["ช่วยให้เข้าใจและวางใจถูก", "ทำให้ไม่มีปัญหาเลย", "ทำให้ชนะทุกคน", "ทำให้ร่ำรวยทันที"],
    ["สติ", "ความโกรธ", "ความหลง", "ความประมาท"],
    ["เห็นอารมณ์ตามความเป็นจริง", "ทำตามอารมณ์ทันที", "กดอารมณ์ไว้เสมอ", "โทษผู้อื่น"],
    ["พิจารณาเหตุและผล", "เชื่อตามทันที", "ตัดสินโดยอารมณ์", "ไม่ต้องตรวจสอบ"],
    ["พิจารณาอย่างมีสติ", "โทษคนอื่น", "หนีทุกครั้ง", "ตอบโต้ทันที"],
    ["รู้เท่าทันความยึดติด", "เพิ่มความอยาก", "เปรียบเทียบตลอดเวลา", "เอาชนะผู้อื่น"],
    ["นำมาปฏิบัติจริง", "เก็บไว้จำอย่างเดียว", "ใช้เฉพาะในเกม", "ไม่ต้องทดลอง"],
    ["เข้าใจเหตุและปัจจัย", "หนีปัญหา", "โทษผู้อื่น", "ทำตามความโกรธ"],
    ["สติ ปัญญา และการปฏิบัติ", "คะแนนอย่างเดียว", "ความสนุกอย่างเดียว", "การแข่งขัน"]
  ][i],
  correct: 0
}));

let currentGame = 0;

function renderGame() {
  const game = games[currentGame];

  document.getElementById("gameTitle").textContent = game.title;
  document.getElementById("progressText").textContent =
    `เกม ${currentGame + 1} / ${games.length}`;
  document.getElementById("question").textContent = game.question;

  const choices = document.getElementById("choices");
  const result = document.getElementById("result");

  choices.innerHTML = "";
  result.textContent = "";

  game.choices.forEach((text, index) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = `${String.fromCharCode(65 + index)}. ${text}`;

    btn.onclick = () => {
      // ป้องกันการกดซ้ำ
      [...choices.children].forEach(b => b.disabled = true);

      if (index === game.correct) {
        btn.classList.add("correct");
        result.textContent = "✓ ถูกต้องครับ";
        result.style.color = "green";
      } else {
        btn.classList.add("wrong");
        choices.children[game.correct].classList.add("correct");
        result.textContent = "✗ ยังไม่ถูก ลองเรียนรู้จากเฉลยครับ";
        result.style.color = "crimson";
      }
    };

    choices.appendChild(btn);
  });

  document.getElementById("prevBtn").disabled = currentGame === 0;
  document.getElementById("nextBtn").disabled = currentGame === games.length - 1;

  document.querySelectorAll(".game-dot").forEach((btn, i) => {
    btn.classList.toggle("active", i === currentGame);
  });
}

function createGameSelector() {
  const selector = document.getElementById("gameSelector");

  games.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = "game-dot";
    btn.textContent = i + 1;
    btn.title = `ไปเกมที่ ${i + 1}`;
    btn.onclick = () => {
      currentGame = i;
      renderGame();
    };
    selector.appendChild(btn);
  });
}

function nextGame() {
  if (currentGame < games.length - 1) {
    currentGame++;
    renderGame();
  }
}

function previousGame() {
  if (currentGame > 0) {
    currentGame--;
    renderGame();
  }
}

createGameSelector();
renderGame();
</script>

</html>
