<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์รวม 15 เกมบาลีไวยากรณ์ (75 คำถาม)</title>
    <style>
        :root {
            --primary: #8b4513;
            --secondary: #d2691e;
            --bg: #fdf5e6;
            --card-bg: #ffffff;
            --text: #333333;
            --correct: #2e7d32;
            --wrong: #c62828;
        }

        body {
            font-family: 'Sarabun', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; font-size: 1.8rem; }
        .header p { margin: 5px 0 0; color: #666; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 2px solid #e1e1e1;
            border-top: 5px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .game-desc {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
            min-height: 35px;
        }

        .game-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-box {
            background: #fff8dc;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary); }
        
        .btn-next {
            background-color: #4caf50;
            margin-top: 5px;
            display: none;
        }
        .btn-next:hover { background-color: #388e3c; }

        .feedback {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        .feedback.correct { color: var(--correct); }
        .feedback.wrong { color: var(--wrong); }

        .score-board {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            color: #777;
        }
    </style>
</head>
<body>

        <p>ฝึกฝนบาลีไวยากรณ์ครบทุกหมวด เกมละ 5 ข้อ</p>
    </div>

                    { q: "ตัทธิต ใช้ลงท้ายคำเพื่อวัตถุประสงค์ใดเป็นหลัก", options: ["ย่อคำให้สั้นลง", "ขยายกิริยา", "แปลงเพศ", "บอกกาลเวลา"], ans: 0 },
                    { q: "'สามัญญตัทธิต' แบ่งออกเป็นกี่หมวดใหญ่", options: ["3 หมวด", "5 หมวด", "9 หมวด", "12 หมวด"], ans: 2 },
                    { q: "ปัจจัย 'ณ' ในตัทธิต มักมีผลอย่างไรกับสระหน้า", options: ["พฤทธิ์ (ทีฆะ) สระหน้า", "ลบสระหน้า", "แปลงเป็น นิคหิต", "ไม่เปลี่ยนแปลง"], ans: 0 },
                    { q: "ตัทธิตที่ใช้บอกความตั้งอยู่ หรือความเป็น (ภาวะ) คือตัทธิตใด", options: ["ภาวตัทธิต", "ชาติตัทธิต", "สมูหตัทธิต", "สังขยาตัทธิต"], ans: 0 },
                    { q: "คำว่า 'มนุสสตฺตํ' (ความเป็นแห่งมนุษย์) ลงปัจจัยใดในภาวตัทธิต", options: ["ตฺต (ตตฺต)", "ณ", "อิยะ", "มย"], ans: 0 }
                ]
            },
            {
                id: 14, title: "14. อุปสัควิภาค", desc: "คำใช้นำหน้านามหรือกิริยาให้ความหมายเปลี่ยนไป",
                questions: [
                    { q: "อุปสัคในภาษาบาลีมีทั้งหมดกี่ตัว", options: ["10 ตัว", "12 ตัว", "20 ตัว", "24 ตัว"], ans: 2 },
                    { q: "อุปสัค 'อภิ' มักมีความหมายว่าอย่างไร", options: ["ปราศจาก", "ยิ่ง, ใหญ่, เฉพาะ", "ลง, ลบ", "กลับความ"], ans: 1 },
                    { q: "อุปสัค 'สุ' มีความหมายว่าอย่างไร", options: ["ดี, งาม, ง่าย", "ชั่ว, ยาก", "ออก, พ้น", "หลีก"], ans: 0 },
                    { q: "อุปสัค 'ทุ' มีความหมายว่าอย่างไร", options: ["ชั่ว, ยาก", "ดี, งาม", "ยิ่ง", "ทั่ว"], ans: 0 },
                    { q: "อุปสัค 'อติ' มีความหมายว่าอย่างไร", options: ["ยิ่ง, ล่วงเกิน", "ลง", "เข้า", "เฉพาะ"], ans: 0 }
                ]
            },
            {
                id: 15, title: "15. นิบาตวิภาค", desc: "คำลงในระหว่างบอกความหมายต่างๆ",
                questions: [
                    { q: "คำว่า 'อปิจ' หรือ 'จ' เป็นนิบาตบอกความหมายใด", options: ["ถาม", "รับ", "เชื่อม (และ/ด้วย)", "ห้าม"], ans: 2 },
                    { q: "นิบาต 'สเจ' หรือ 'ยทิ' ใช้ในความหมายใด", options: ["ถ้าว่า / หากว่า", "เพราะว่า", "อนึ่ง", "ผิว่า"], ans: 0 },
                    { q: "นิบาต 'มา' (เช่น มา กโรถ) ใช้ในความหมายใด", options: ["อย่า / ห้าม", "อีก", "แน่นอน", "แท้จริง"], ans: 0 },
                    { q: "นิบาต 'อถ' ใช้ในความหมายใด", options: ["ครั้งนั้น / ต่อจากนั้น", "เหมือน", "เพื่อ", "คำถาม"], ans: 0 },
                    { q: "นิบาต 'วิย' หรือ 'อิว' ใช้ในความหมายใด", options: ["เปรียบเหมือน / ราวกับ", "ห้าม", "รับคำ", "ต่อมา"], ans: 0 }
                ]
            }
        ];

        // บันทึกสถานะข้อปัจจุบันและคะแนนของแต่ละเกม
        let gameState = gamesData.map(() => ({ currentQ: 0, score: 0 }));

        function renderGames() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            gamesData.forEach((game, gIdx) => {
                const state = gameState[gIdx];
                const qData = game.questions[state.currentQ];

                const card = document.createElement('div');
                card.className = 'game-card';
                
                let optionsHTML = '';
                qData.options.forEach((opt, optIdx) => {
                    optionsHTML += `<button id="btn-${gIdx}-${optIdx}" onclick="checkAnswer(${gIdx}, ${optIdx})">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="game-title">${game.title}</div>
                    <div class="game-desc">${game.desc}</div>
                    <div class="game-body">
                        <div class="q-box" id="qbox-${gIdx}">${qData.q}</div>
                        <div class="options-grid" id="optgrid-${gIdx}">
                            ${optionsHTML}
                        </div>
                        <div class="feedback" id="feedback-${gIdx}"></div>
                        <button class="btn-next" id="next-${gIdx}" onclick="nextQuestion(${gIdx})">ข้อถัดไป ➔</button>
                        <div class="score-board">
                            <span>ข้อที่: ${state.currentQ + 1}/5</span>
                            <span id="score-${gIdx}">คะแนน: ${state.score}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function checkAnswer(gIdx, selectedIdx) {
            const game = gamesData[gIdx];
            const state = gameState[gIdx];
            const qData = game.questions[state.currentQ];
            const feedbackEl = document.getElementById(`feedback-${gIdx}`);
            const nextBtn = document.getElementById(`next-${gIdx}`);

            // ปิดไม่ให้กดปุ่มตอบซ้ำในข้อเดิม
            const buttons = document.querySelectorAll(`#optgrid-${gIdx} button`);
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIdx === qData.ans) {
                feedbackEl.textContent = "✓ ถูกต้อง! เก่งมาก";
                feedbackEl.className = "feedback correct";
                state.score += 1;
                document.getElementById(`score-${gIdx}`).textContent = `คะแนน: ${state.score}`;
            } else {
                feedbackEl.textContent = `✗ ยังไม่ถูก (เฉลย: ${qData.options[qData.ans]})`;
                feedbackEl.className = "feedback wrong";
            }

            if (state.currentQ < game.questions.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                feedbackEl.textContent += ` [จบเกม! ได้ ${state.score}/5 คะแนน]`;
                nextBtn.textContent = "เล่นใหม่อีกครั้ง ↺";
                nextBtn.style.display = 'block';
            }
        }

        function nextQuestion(gIdx) {
            const game = gamesData[gIdx];
            const state = gameState[gIdx];

            if (state.currentQ < game.questions.length - 1) {
                state.currentQ += 1;
            } else {
                // รีเซ็ตเกมถ้าเล่นครบ 5 ข้อแล้ว
                state.currentQ = 0;
                state.score = 0;
            }

            // โหลดเฉพาะการ์ดเกมนั้นๆ ใหม่
            const qData = game.questions[state.currentQ];
            document.getElementById(`qbox-${gIdx}`).textContent = qData.q;
            
            const optGrid = document.getElementById(`optgrid-${gIdx}`);
            optGrid.innerHTML = '';
            qData.options.forEach((opt, optIdx) => {
                optGrid.innerHTML += `<button id="btn-${gIdx}-${optIdx}" onclick="checkAnswer(${gIdx}, ${optIdx})">${opt}</button>`;
            });

            document.getElementById(`feedback-${gIdx}`).textContent = '';
            document.getElementById(`next-${gIdx}`).style.display = 'none';
            document.getElementById(`next-${gIdx}`).textContent = 'ข้อถัดไป ➔';
            
            // อัปเดตตัวเลขข้อและคะแนน
            const scoreBoard = document.querySelectorAll(`#main-grid .game-card`)[gIdx].querySelector('.score-board');
            scoreBoard.children[0].textContent = `ข้อที่: ${state.currentQ + 1}/5`;
            scoreBoard.children[1].textContent = `คะแนน: ${state.score}`;
        }

        window.onload = renderGames;
    </script>
</body>
</html>
