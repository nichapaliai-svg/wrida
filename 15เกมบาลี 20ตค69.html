<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์รวม 15 เกมบาลีไวยากรณ์ (75 คำถาม)</title>
    <style>
        :root {
            --primary: #8b4513;
            --secondary: #d2691e;
            --bg: #fdf5e6;
            --card-bg: #ffffff;
            --text: #333333;
            --correct: #2e7d32;
            --wrong: #c62828;
        }

        body {
            font-family: 'Sarabun', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; font-size: 1.8rem; }
        .header p { margin: 5px 0 0; color: #666; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 2px solid #e1e1e1;
            border-top: 5px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .game-desc {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
            min-height: 35px;
        }

        .game-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-box {
            background: #fff8dc;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary); }
        
        .btn-next {
            background-color: #4caf50;
            margin-top: 5px;
            display: none;
        }
        .btn-next:hover { background-color: #388e3c; }

        .feedback {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        .feedback.correct { color: var(--correct); }
        .feedback.wrong { color: var(--wrong); }

        .score-board {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            color: #777;
        }

        .profile-bar{max-width:1400px;margin:0 auto 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:#fffaf0;border:1px solid #e8c9a6;border-radius:10px;padding:12px 16px}
        .profile-left,.profile-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .profile-bar label{font-size:.9rem;color:var(--primary);font-weight:700}
        .profile-bar input,.profile-bar select{border:1px solid #d7b99a;border-radius:6px;padding:8px;font:inherit;max-width:100%;background:#fff}
        .profile-bar input[name="fullName"]{min-width:220px}
        .admin-btn{background:#704214;padding:9px 13px;white-space:nowrap}
        .notice{max-width:1400px;margin:0 auto 12px;color:#72512d;font-size:.9rem}
        .overlay{position:fixed;inset:0;background:rgba(30,20,10,.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
        .modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fffaf0;border-radius:12px;padding:22px;box-shadow:0 15px 45px #0003}
        .modal h2{margin-top:0;color:var(--primary)}
        .modal input{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 12px;border:1px solid #d7b99a;border-radius:6px;font:inherit}
        .modal .actions{display:flex;gap:8px;flex-wrap:wrap}
        .modal .secondary{background:#777}
        .admin-table-wrap{overflow:auto}
        .admin-table{width:100%;border-collapse:collapse;background:white;margin-top:12px;font-size:.9rem}
        .admin-table th,.admin-table td{padding:8px;border:1px solid #eadbc9;text-align:left;white-space:nowrap}
        .admin-table th{background:#f6e4cc;color:#704214}
        .status-msg{margin:8px 0;color:#704214;white-space:pre-wrap}
        @media(max-width:650px){body{padding:10px}.profile-bar{grid-template-columns:1fr}.profile-left,.profile-right{align-items:stretch}.profile-left input[name="fullName"]{min-width:0;width:100%}.profile-right{justify-content:space-between}.header h1{font-size:1.35rem}.game-grid{grid-template-columns:1fr;gap:14px}}

    </style>
</head>
<body>

    <section class="profile-bar" aria-label="ข้อมูลผู้เรียน">
      <div class="profile-left">
        <label for="fullName">ชื่อ-นามสกุล</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="กรอกชื่อ-นามสกุล">
      </div>
      <div class="profile-right">
        <label for="gender">เพศ</label>
        <select id="gender"><option value="">เลือกเพศ</option><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option><option value="ไม่ระบุ">ไม่ระบุ</option></select>
        <label for="age">อายุ</label>
        <input id="age" type="number" min="1" max="120" inputmode="numeric" placeholder="ปี" style="width:78px">
        <button class="admin-btn" onclick="openAdminLogin()">ผู้ดูแล</button>
      </div>
    </section>
    <div class="header">
        <h1>เกมบาลีไวยากรณ์ 15 in 1 (75 คำถาม)</h1>
        <p>ฝึกฝนบาลีไวยากรณ์ครบทุกหมวด เกมละ 5 ข้อ</p>
    </div>
    <div id="cloud-status" class="notice">กรอกชื่อ-นามสกุล เพศ และอายุก่อนเริ่มทำข้อสอบ ระบบจะบันทึกคะแนนออนไลน์เมื่อเชื่อมต่อ Supabase แล้ว</div>
    <div class="game-grid" id="main-grid"></div>

    <div class="overlay" id="admin-overlay" role="dialog" aria-modal="true" aria-labelledby="admin-title">
      <section class="modal">
        <h2 id="admin-title">เข้าสู่ระบบผู้ดูแล</h2>
        <div id="admin-login">
          <p>เฉพาะบัญชีผู้ดูแลที่ได้รับอนุญาตเท่านั้นจึงจะดูผลสอบได้</p>
          <label for="admin-email">อีเมลผู้ดูแล</label>
          <input id="admin-email" type="email" autocomplete="username" placeholder="อีเมลผู้ดูแล">
          <label for="admin-password">รหัสผ่าน</label>
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
          <div class="actions"><button onclick="adminLogin()">เข้าสู่ระบบ</button><button class="secondary" onclick="closeAdmin()">ยกเลิก</button></div>
        </div>
        <div id="admin-report" style="display:none">
          <div class="actions"><button onclick="loadAdminResults()">รีเฟรชข้อมูล</button><button class="secondary" onclick="adminLogout()">ออกจากระบบ</button><button class="secondary" onclick="closeAdmin()">ปิด</button></div>
          <p id="admin-message" class="status-msg"></p>
          <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>วันเวลา</th><th>ชื่อ-นามสกุล</th><th>เพศ</th><th>อายุ</th><th>หมวดเกม</th><th>คะแนน</th></tr></thead><tbody id="admin-results"></tbody></table></div>
        </div>
        <p id="login-status" class="status-msg"></p>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const gamesData = [
            {
                id: 1, title: "1. สนธิและอักขรวิธี", desc: "ทดสอบความรู้เรื่องสระ พยัญชนะ และนิคหิต",
                questions: [
                    { q: "ตัวอักษรใดต่อไปนี้คือ 'นิคหิต' ( ํ )", options: ["อัง (อํ)", "อา", "อิ", "อู"], ans: 0 },
                    { q: "สระในภาษาบาลีมีทั้งหมดกี่ตัว", options: ["6 ตัว", "8 ตัว", "10 ตัว", "12 ตัว"], ans: 1 },
                    { q: "พยัญชนะในภาษาบาลีมีทั้งหมดกี่ตัว", options: ["32 ตัว", "33 ตัว", "34 ตัว", "35 ตัว"], ans: 1 },
                    { q: "สระ รัสสะ (เสียงสั้น) มีกี่ตัว", options: ["2 ตัว", "3 ตัว", "4 ตัว", "5 ตัว"], ans: 1 },
                    { q: "พยัญชนะ 'ง' จัดเป็นพยัญชนะอะไร", options: ["พยัญชนะวรรค", "อวรรค", "สระ", "นิคหิต"], ans: 0 }
                ]
            },
            {
                id: 2, title: "2. วรรคและพยัญชนะ", desc: "การจัดหมวดหมู่พยัญชนะวรรคทั้ง 5",
                questions: [
                    { q: "พยัญชนะ 'ช' อยู่ในวรรคใด", options: ["ก วรรค", "จ วรรค", "ฏ วรรค", "ต วรรค"], ans: 1 },
                    { q: "พยัญชนะวรรค มีทั้งหมดกี่ตัว", options: ["20 ตัว", "25 ตัว", "30 ตัว", "33 ตัว"], ans: 1 },
                    { q: "พยัญชนะ 'ต ถ ท ธ น' อยู่ในวรรคใด", options: ["จ วรรค", "ฏ วรรค", "ต วรรค", "ป วรรค"], ans: 2 },
                    { q: "พยัญชนะ 'อวรรค' มีทั้งหมดกี่ตัว", options: ["7 ตัว", "8 ตัว", "9 ตัว", "10 ตัว"], ans: 1 },
                    { q: "ตัวใดจัดเป็นพยัญชนะที่สุดวรรค (นิคหิต/อนุนาสิก)", options: ["ก", "ช", "ม", "ต"], ans: 2 }
                ]
            },
            {
                id: 3, title: "3. ฐานกรณุฏฐาน", desc: "กำเนิดของเสียงพยัญชนะและสระ",
                questions: [
                    { q: "กัณฐชะ (เสียงเกิดที่คอ) ได้แก่อักขระชุดใด", options: ["อะ อา ก ข ค ง", "อิ อี จ ฉ", "อุ อู ป ผ", "เอ โอ"], ans: 0 },
                    { q: "อักขระที่เกิดจากริมฝีปาก เรียกว่าอะไร", options: ["กัณฐชะ", "โอฏฐชะ", "มุทธชะ", "ทัณฑชะ"], ans: 1 },
                    { q: "สระ 'เอ' เกิดจากฐานใดร่วมกัน", options: ["คอ+เพดาน", "คอ+ริมฝีปาก", "ฟัน+ริมฝีปาก", "อก+คอ"], ans: 0 },
                    { q: "สระ 'โอ' เกิดจากฐานใดร่วมกัน", options: ["คอ+เพดาน", "คอ+ริมฝีปาก", "เพดาน+จมูก", "ฟัน+เพดาน"], ans: 1 },
                    { q: "พยัญชนะวรรค ฏะ (ฏ ฐ ฑ ฒ ณ) เกิดจากฐานใด", options: ["คอ", "เพดาน", "ศีรษะ/ปุ่มเหงือก (มุทธชะ)", "ฟัน"], ans: 2 }
                ]
            },
            {
                id: 4, title: "4. ปุริสลิงค์ (ปุลลิงค์)", desc: "การแจกวิภัตตินามนามเพศชาย",
                questions: [
                    { q: "ปุริส + สิ (ปฐมาวิภัตติ เอกวจนะ) ได้รูปใด", options: ["ปุริสัง", "ปุริเสนะ", "ปุริโส", "ปุริสา"], ans: 2 },
                    { q: "ปุริส + โย (ปฐมาวิภัตติ พหุวจนะ) ได้รูปใด", options: ["ปุริโส", "ปุริสา", "ปุริเส", "ปุริสัง"], ans: 1 },
                    { q: "ปุริส + อัง (ทุติยาวิภัตติ เอกวจนะ) ได้รูปใด", options: ["ปุริสัง", "ปุริเส", "ปุริสัสสะ", "ปุริสาสุ"], ans: 0 },
                    { q: "คำว่า 'ปุริเสหิ' เป็นวิภัตติใด", options: ["ปฐมา", "ตติยา/ปัญจมี พหุ", "ฉัฏฐี", "สัตตมี"], ans: 1 },
                    { q: "'ปุริสัสสะ' เป็นวิภัตติใดได้บ้าง", options: ["ปฐมา", "ทุติยา", "จตุรถี/ฉัฏฐี เอกะ", "สัตตมี"], ans: 2 }
                ]

            {
                id: 5, title: "5. อิตถีลิงค์", desc: "การแจกวิภัตตินามนามเพศหญิง (อา การันต์)",

                    { q: "กญฺญา + โย (ปฐมาวิภัตติ พหุวจนะ) ได้รูปใด", options: ["กญฺญาย", "กญฺญาโย / กญฺญา", "กญฺญํ", "กญฺญาหิ"], ans: 1 },
                    { q: "กญฺญา + สิ (ปฐมาวิภัตติ เอกวจนะ) ได้รูปใด", options: ["กญฺญา", "กญฺญํ", "กญฺญาย", "กญฺญาโย"], ans: 0 },
                    { q: "รูป 'กญฺญํ' เป็นวิภัตติใด", options: ["ปฐมา", "ทุติยา เอกะ", "ตติยา", "ฉัฏฐี"], ans: 1 },
                    { q: "คำว่า 'กญฺญานํ' เป็นวิภัตติใด", options: ["ทุติยา พหุ", "จตุรถี/ฉัฏฐี พหุ", "สัตตมี เอกะ", "ปัญจมี"], ans: 1 },
                    { q: "'กญฺญายํ' หรือ 'กญฺญาย' ลงสัตตมีวิภัตติแปลว่าอะไร", options: ["ซึ่งนางสาวน้อย", "ด้วยนางสาวน้อย", "ในนางสาวน้อย", "ของนางสาวน้อย"], ans: 2 }
                ]
            },
            {
                id: 6, title: "6. นปุงสกลิงค์", desc: "นามนามเพศกลาง (อ การันต์)",
                questions: [
                    { q: "คำว่า 'จิตฺต' (ใจ) + สิ ปฐมาวิภัตติ ได้รูปใด", options: ["จิตฺโต", "จิตฺตํ", "จิตฺตา", "จิตฺเต"], ans: 1 },
                    { q: "จิตฺต + โย (ปฐมาวิภัตติ พหุวจนะ) ได้รูปใด", options: ["จิตฺตานิ", "จิตฺตา", "จิตฺโต", "จิตฺตัง"], ans: 0 },
                    { q: "'จิตฺเตน' เป็นตติยาวิภัตติ แปลว่าอะไร", options: ["อันใจ / ด้วยใจ", "ซึ่งใจ", "แก่ใจ", "แห่งใจ"], ans: 0 },
                    { q: "คำว่า 'ผล' (ผลไม้) จัดเป็นลิงค์ใด", options: ["ปุลลิงค์", "อิตถีลิงค์", "นปุงสกลิงค์", "ไม่มีลิงค์"], ans: 2 },
                    { q: "รูป 'ผลานิ' เป็นวจนะใด", options: ["เอกวจนะ", "พหุวจนะ", "ทวิวจนะ", "อพยยวจนะ"], ans: 1 }

            {
                id: 7, title: "7. สัพพนาม (สรรพนาม)", desc: "ปุริสสัพพนาม และ วิเสสนสัพพนาม",

                    { q: "'เอต' สัพพนาม แปลว่าอะไร", options: ["นั้น", "นี้", "โน้น", "ใคร"], ans: 1 },

                    { q: "'อมุ' สัพพนาม แปลว่าอะไร", options: ["นั้น", "นี้", "โน้น/แนะ", "ใคร"], ans: 2 },
                    { q: "'กิ' สัพพนาม (กิง) แปลว่าอะไร", options: ["ใคร / อะไร", "โน้น", "นี้", "นั้น"], ans: 0 }
                ]
            },
            {
                id: 8, title: "8. สังขยา (การนับจำนวน)", desc: "ปกติสังขยา และ ปูรณสังขยา",
                questions: [
                    { q: "'ปญฺจ' (ปัญจะ) หมายถึงจำนวนเท่าใด", options: ["3", "4", "5", "6"], ans: 2 },
                    { q: "'เอกาทสะ' หมายถึงจำนวนเท่าใด", options: ["10", "11", "12", "21"], ans: 1 },
                    { q: "'วีสติ' หมายถึงจำนวนเท่าใด", options: ["12", "20", "30", "100"], ans: 1 },
                    { q: "'สตํ' หมายถึงจำนวนเท่าใด", options: ["50", "100", "1,000", "10,000"], ans: 1 },
                    { q: "'ปฐโม' จัดเป็นปูรณสังขยา แปลว่าอะไร", options: ["ที่ 1", "ที่ 2", "ที่ 3", "ที่ 4"], ans: 0 }
                ]
            },
            {
                id: 9, title: "9. อาขยาต: ธาตุวิภาค", desc: "ความหมายของธาตุพื้นฐานในกิริยา",
                questions: [
                    { q: "ธาตุ 'ภู' (ภู ธาตุ) มีความหมายว่าอย่างไร", options: ["ในความมี ความเป็น", "ในความไป", "ในความทำ", "ในความกิน"], ans: 0 },
                    { q: "ธาตุ 'คมฺ' (คม ธาตุ) มีความหมายว่าอย่างไร", options: ["ในความเห็น", "ในความไป", "ในความนั่ง", "ในความนอน"], ans: 1 },
                    { q: "ธาตุ 'กรฺ' (กร ธาตุ) มีความหมายว่าอย่างไร", options: ["ในความทำ", "ในความพูด", "ในความตาย", "ในความฟัง"], ans: 0 },
                    { q: "ธาตุ 'ทิสฺ' (ทิส ธาตุ) มีความหมายว่าอย่างไร", options: ["ในความเห็น", "ในความให้", "ในความถือเอา", "ในความยืน"], ans: 0 },
                    { q: "ธาตุ 'ทา' (ทา ธาตุ) มีความหมายว่าอย่างไร", options: ["ในความให้", "ในความกิน", "ในความดื่ม", "ในความรู้"], ans: 0 }
                ]
            },
            {
                id: 10, title: "10. วัตตมานาวิภัตติ", desc: "การแจกวิภัตติบอกปัจจุบันกาล (ติ อันติ...)",

                questions: [

                    { q: "อุปสัค 'สุ' มีความหมายว่าอย่างไร", options: ["ดี, งาม, ง่าย", "ชั่ว, ยาก", "ออก, พ้น", "หลีก"], ans: 0 },
                    { q: "อุปสัค 'ทุ' มีความหมายว่าอย่างไร", options: ["ชั่ว, ยาก", "ดี, งาม", "ยิ่ง", "ทั่ว"], ans: 0 },
                    { q: "อุปสัค 'อติ' มีความหมายว่าอย่างไร", options: ["ยิ่ง, ล่วงเกิน", "ลง", "เข้า", "เฉพาะ"], ans: 0 }
                ]

            {

                questions: [

                    { q: "นิบาต 'สเจ' หรือ 'ยทิ' ใช้ในความหมายใด", options: ["ถ้าว่า / หากว่า", "เพราะว่า", "อนึ่ง", "ผิว่า"], ans: 0 },
                    { q: "นิบาต 'มา' (เช่น มา กโรถ) ใช้ในความหมายใด", options: ["อย่า / ห้าม", "อีก", "แน่นอน", "แท้จริง"], ans: 0 },
                    { q: "นิบาต 'อถ' ใช้ในความหมายใด", options: ["ครั้งนั้น / ต่อจากนั้น", "เหมือน", "เพื่อ", "คำถาม"], ans: 0 },
                    { q: "นิบาต 'วิย' หรือ 'อิว' ใช้ในความหมายใด", options: ["เปรียบเหมือน / ราวกับ", "ห้าม", "รับคำ", "ต่อมา"], ans: 0 }
                ]
            }
        ];

        // ตั้งค่า Supabase ของคุณในสองบรรทัดนี้ก่อนเผยแพร่เว็บไซต์
        // ใช้ Project URL และ anon/public key เท่านั้น ห้ามใส่ service_role key ใน HTML
        const SUPABASE_URL = "https://jyiwohexhmertqvfummt.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_qPPtC5amEHiicevhlmaBaQ_n-YA-5gq";
        const ADMIN_EMAIL = "nichapaliai@gmail.com".toLowerCase();
        let supabaseClient = null;
        let activeAdminSession = false;

        function initSupabase() {
const configured =
  SUPABASE_URL.startsWith("https://") &&
  SUPABASE_ANON_KEY.length > 20;
            if (configured && window.supabase?.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById("cloud-status").textContent =
                    "เชื่อมต่อระบบออนไลน์แล้ว เมื่อทำแต่ละหมวดครบ 5 ข้อ คะแนนจะถูกบันทึก";
            } else {
                document.getElementById("cloud-status").textContent =
                    "ยังไม่ได้ตั้งค่า Supabase: เกมเล่นได้ แต่คะแนนจะยังไม่ถูกบันทึกออนไลน์";
            }
        }
        function learnerProfile() {
            const fullName = document.getElementById("fullName").value.trim();
            const gender = document.getElementById("gender").value;
            const age = Number(document.getElementById("age").value);
            if (!fullName || !gender || !Number.isInteger(age) || age < 1 || age > 120) {
                alert("กรุณากรอกชื่อ-นามสกุล เลือกเพศ และกรอกอายุให้ถูกต้องก่อนตอบข้อสอบ");
                return null;
            }
            return { full_name: fullName, gender, age };
        }
        async function saveGameResult(game, state) {
            const profile = learnerProfile();
            if (!profile) return;
            if (!supabaseClient) {
                document.getElementById("cloud-status").textContent =
                    "ยังไม่ได้บันทึกออนไลน์ กรุณาตั้งค่า Supabase URL และ anon key ในไฟล์ HTML";
                return;
            }
            const row = {
                ...profile,
                game_id: game.id,
                game_title: game.title,
                score: state.score,
                total_questions: game.questions.length,
                completed_at: new Date().toISOString()
            };
            const { error } = await supabaseClient.from("pali_quiz_results").insert(row);
            const status = document.getElementById("cloud-status");
            if (error) {
                status.textContent = "บันทึกออนไลน์ไม่สำเร็จ: " + error.message;
            } else {
                status.textContent = `บันทึกผลหมวด "${game.title}" ออนไลน์แล้ว (${state.score}/${game.questions.length} คะแนน)`;
            }
        }
        function openAdminLogin() {
            document.getElementById("admin-overlay").style.display = "flex";
            document.getElementById("login-status").textContent = "";
        }
        function closeAdmin() {
            document.getElementById("admin-overlay").style.display = "none";
        }
        async function adminLogin() {
            const status = document.getElementById("login-status");
            if (!supabaseClient) {
                status.textContent = "ยังไม่ได้ตั้งค่า Supabase URL และ anon key ในไฟล์ HTML";
                return;
            }
const email = document.getElementById("admin-email").value.trim().toLowerCase();
const password = document.getElementById("admin-password").value;
            if (!email || !password) { status.textContent = "กรุณากรอกอีเมลและรหัสผ่าน"; return; }
            if (ADMIN_EMAIL.includes("ใส่อีเมล") || email !== ADMIN_EMAIL) {
                status.textContent = "อีเมลนี้ไม่ได้กำหนดเป็นผู้ดูแลในไฟล์ HTML";
                return;
            }
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { status.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + error.message; return; }
            if (!data.user || data.user.email?.toLowerCase() !== ADMIN_EMAIL) {
                await supabaseClient.auth.signOut();
                status.textContent = "บัญชีนี้ไม่ได้รับอนุญาต";
                return;
            }
            activeAdminSession = true;
            document.getElementById("admin-login").style.display = "none";
            document.getElementById("admin-report").style.display = "block";
            document.getElementById("admin-title").textContent = "รายงานผลสอบสำหรับผู้ดูแล";
            status.textContent = "";
            await loadAdminResults();
        }
        async function loadAdminResults() {
            const message = document.getElementById("admin-message");
            const tbody = document.getElementById("admin-results");
            if (!activeAdminSession || !supabaseClient) { message.textContent = "กรุณาเข้าสู่ระบบผู้ดูแล"; return; }
            message.textContent = "กำลังโหลดข้อมูล...";
            const { data, error } = await supabaseClient.from("pali_quiz_results")
                .select("full_name,gender,age,game_title,score,total_questions,completed_at")
                .order("completed_at", { ascending: false }).limit(1000);
            if (error) {
                message.textContent = "อ่านข้อมูลไม่สำเร็จ: " + error.message + " (ตรวจสอบนโยบาย RLS และอีเมลผู้ดูแล)";
                return;
            }
            tbody.innerHTML = "";
            (data || []).forEach(row => {
                const tr = document.createElement("tr");
                const values = [
                    row.completed_at ? new Date(row.completed_at).toLocaleString("th-TH") : "",
                    row.full_name, row.gender, row.age, row.game_title,
                    `${row.score}/${row.total_questions}`
                ];
                values.forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value ?? "";
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            message.textContent = `พบข้อมูล ${data?.length || 0} รายการ (แสดงล่าสุดไม่เกิน 1,000 รายการ)`;
        }
        async function adminLogout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            activeAdminSession = false;
            document.getElementById("admin-login").style.display = "block";
            document.getElementById("admin-report").style.display = "none";
            document.getElementById("admin-title").textContent = "เข้าสู่ระบบผู้ดูแล";
            document.getElementById("admin-password").value = "";
            document.getElementById("login-status").textContent = "ออกจากระบบแล้ว";
        }

        // บันทึกสถานะข้อปัจจุบันและคะแนนของแต่ละเกม
        let gameState = gamesData.map(() => ({ currentQ: 0, score: 0, saved: false }));

        function renderGames() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            gamesData.forEach((game, gIdx) => {
                const state = gameState[gIdx];
                const qData = game.questions[state.currentQ];

                const card = document.createElement('div');
                card.className = 'game-card';
                
                let optionsHTML = '';
                qData.options.forEach((opt, optIdx) => {
                    optionsHTML += `<button id="btn-${gIdx}-${optIdx}" onclick="checkAnswer(${gIdx}, ${optIdx})">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="game-title">${game.title}</div>
                    <div class="game-desc">${game.desc}</div>
                    <div class="game-body">
                        <div class="q-box" id="qbox-${gIdx}">${qData.q}</div>
                        <div class="options-grid" id="optgrid-${gIdx}">
                            ${optionsHTML}
                        </div>
                        <div class="feedback" id="feedback-${gIdx}"></div>
                        <button class="btn-next" id="next-${gIdx}" onclick="nextQuestion(${gIdx})">ข้อถัดไป ➔</button>
                        <div class="score-board">
                            <span>ข้อที่: ${state.currentQ + 1}/5</span>
                            <span id="score-${gIdx}">คะแนน: ${state.score}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function checkAnswer(gIdx, selectedIdx) {
            if (!learnerProfile()) return;
            const game = gamesData[gIdx];
            const state = gameState[gIdx];
            const qData = game.questions[state.currentQ];
            const feedbackEl = document.getElementById(`feedback-${gIdx}`);
            const nextBtn = document.getElementById(`next-${gIdx}`);

            // ปิดไม่ให้กดปุ่มตอบซ้ำในข้อเดิม
            const buttons = document.querySelectorAll(`#optgrid-${gIdx} button`);
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIdx === qData.ans) {
                feedbackEl.textContent = "✓ ถูกต้อง! เก่งมาก";
                feedbackEl.className = "feedback correct";
                state.score += 1;
                document.getElementById(`score-${gIdx}`).textContent = `คะแนน: ${state.score}`;
            } else {
                feedbackEl.textContent = `✗ ยังไม่ถูก (เฉลย: ${qData.options[qData.ans]})`;
                feedbackEl.className = "feedback wrong";
            }

            if (state.currentQ < game.questions.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                feedbackEl.textContent += ` [จบเกม! ได้ ${state.score}/5 คะแนน]`;
                nextBtn.textContent = "เล่นใหม่อีกครั้ง ↺";
                nextBtn.style.display = 'block';
                if (!state.saved) {
                    state.saved = true;
                    saveGameResult(game, state);
                }
            }
        }

        function nextQuestion(gIdx) {
            const game = gamesData[gIdx];
            const state = gameState[gIdx];

            if (state.currentQ < game.questions.length - 1) {
                state.currentQ += 1;
            } else {
                // รีเซ็ตเกมถ้าเล่นครบ 5 ข้อแล้ว
                state.currentQ = 0;
                state.score = 0;
                state.saved = false;
            }

            // โหลดเฉพาะการ์ดเกมนั้นๆ ใหม่
            const qData = game.questions[state.currentQ];
            document.getElementById(`qbox-${gIdx}`).textContent = qData.q;
            
            const optGrid = document.getElementById(`optgrid-${gIdx}`);
            optGrid.innerHTML = '';
            qData.options.forEach((opt, optIdx) => {
                optGrid.innerHTML += `<button id="btn-${gIdx}-${optIdx}" onclick="checkAnswer(${gIdx}, ${optIdx})">${opt}</button>`;
            });

            document.getElementById(`feedback-${gIdx}`).textContent = '';
            document.getElementById(`next-${gIdx}`).style.display = 'none';
            document.getElementById(`next-${gIdx}`).textContent = 'ข้อถัดไป ➔';
            
            // อัปเดตตัวเลขข้อและคะแนน
            const scoreBoard = document.querySelectorAll(`#main-grid .game-card`)[gIdx].querySelector('.score-board');
            scoreBoard.children[0].textContent = `ข้อที่: ${state.currentQ + 1}/5`;
            scoreBoard.children[1].textContent = `คะแนน: ${state.score}`;
        }

        window.onload = () => { initSupabase(); renderGames(); };
    </script>
